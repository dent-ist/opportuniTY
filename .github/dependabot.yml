version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    ignore:
      # 9.x moved to the OSMF EULA; stay on the last MIT-licensed major (see Directory.Packages.props).
      - dependency-name: JsonSchema.Net
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "AwesomeAssertions", "NetArchTest*"]
  - package-ecosystem: npm
    directory: /src/Opportunity.Web
    schedule: { interval: weekly }
    ignore:
      # The TypeScript major is dictated by the Angular major; upgrade both together (ng update), not via Dependabot.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
  - package-ecosystem: docker
    directory: /deploy/docker-compose
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # Image base images (E01-T05): FROM lines in deploy/docker/*.Dockerfile, pinned tag@digest.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
    ignore:
      # Node majors are a deliberate LTS decision pinned in versions.env (NODE) and .nvmrc; CI checks they agree.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
