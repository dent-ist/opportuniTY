# OpenTelemetry Collector (contrib, Apache-2.0) for the `observability` profile (E19-T04, ADR-017).
# Apps send OTLP here (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317); the collector fans out to
# Jaeger (traces), Prometheus (metrics, OTLP receiver) and Loki (logs). Never to the product OpenSearch cluster (Q-42).
# The same file is the starting point for Full deployments that ship telemetry to an operator-run backend.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  # Defense in depth for the telemetry trust boundary (ADR-015 TB13, D10.5): the apps already apply an attribute
  # allow-list; the collector also drops what must never leave a process, in case a client is misconfigured.
  attributes/scrub:
    actions:
      - { key: url.query, action: delete }
      - { key: db.query.text, action: delete }
      - { key: db.statement, action: delete }
      - { key: db.npgsql.data_source, action: delete }
      - { key: client.address, action: delete }
      - { key: user_agent.original, action: delete }
      - { key: QueryString, action: delete }
      - { pattern: ^http\.(request|response)\.header\..*, action: delete }
  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlphttp/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
