# Full profile SeaweedFS filer (E19-T06, ADR-020 rule 2 as amended by ADR-016 §2.7): object metadata in its own
# PostgreSQL cluster (filer-postgres), over TLS with certificate verification. The password is not here: run.sh passes
# it from the Docker secret as WEED_POSTGRES2_PASSWORD, which overrides this file.
[postgres2]
enabled = true
createTable = """
  CREATE TABLE IF NOT EXISTS "%s" (
    dirhash   BIGINT,
    name      VARCHAR(65535),
    directory VARCHAR(65535),
    meta      bytea,
    PRIMARY KEY (dirhash, name)
  );
"""
hostname = "filer-postgres"
port = 5432
username = "seaweedfs"
password = ""
database = "seaweedfs"
schema = ""
sslmode = "verify-full"
sslrootcert = "/etc/seaweedfs/tls/ca.crt"
connection_max_idle = 50
connection_max_open = 50
connection_max_lifetime_seconds = 300
pgbouncer_compatible = false
enableUpsert = true
upsertQuery = """
  INSERT INTO "%[1]s" (dirhash, name, directory, meta)
    VALUES($1, $2, $3, $4)
    ON CONFLICT (dirhash, name) DO UPDATE SET
      directory=EXCLUDED.directory,
      meta=EXCLUDED.meta
"""
