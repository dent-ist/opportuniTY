# Full profile pgBackRest configuration (E19-T08, ADR-016 §2; runbook docs/operations/backup-and-restore.md).
# Mounted at /etc/pgbackrest/pgbackrest.conf in the postgres, postgres-replica and pgbackrest containers. Secrets are not
# in this file: entrypoint.sh exports them from Docker secrets as PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_REPO1_S3_KEY
# and PGBACKREST_REPO1_S3_KEY_SECRET (pgBackRest reads every option from PGBACKREST_<OPTION> as well).
#
# repo1: a bucket of its own (opportunity-pgbackrest) with its own S3 identity, separate from the artifact bucket and not
#        readable by any application login (T-63), encrypted with aes-256-cbc. Off-site repo2 is an operator choice
#        (Q-40): add repo2-* options for a second bucket or host, see the runbook.

[global]
repo1-type=s3
repo1-s3-endpoint=s3
repo1-storage-port=8333
repo1-s3-bucket=opportunity-pgbackrest
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-ca-file=/etc/opportunity/tls/ca.crt
repo1-path=/opportunity
repo1-cipher-type=aes-256-cbc
# Time-based retention = WorkspaceDeletion:BackupRetention (35 days, ADR-016 §2.4; the destruction certificate states it).
# Differential and incremental backups and the WAL they need expire with the full backup they depend on.
repo1-retention-full-type=time
repo1-retention-full=35
repo1-bundle=y
repo1-block=y

# Asynchronous archiving (ADR-016 §2.2): archive-push returns once the segment is queued in the spool, a background
# process pushes in parallel. archive_timeout = 60 s on the server bounds the RPO to about 2 minutes (alert at 4).
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=8GiB
compress-type=zst
compress-level=3
process-max=4
start-fast=y
delta=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
lock-path=/tmp/pgbackrest

[global:archive-push]
process-max=2

[opportunity]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
pg1-database=postgres
