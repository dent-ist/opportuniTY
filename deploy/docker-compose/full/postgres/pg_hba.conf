# Full profile (E19-T06, ADR-015 D14.2): TLS and SCRAM only. There is no `host` (plain TCP) line, so a client without
# TLS is refused; clients verify the server certificate against the installation CA (sslmode=verify-full).
# TYPE   DATABASE     USER        ADDRESS  METHOD
local    all          postgres             peer
local    all          all                  scram-sha-256
hostssl  replication  replicator  all      scram-sha-256
hostssl  all          all         all      scram-sha-256
