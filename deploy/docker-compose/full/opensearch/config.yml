# Full profile security plugin configuration (E19-T06, ADR-015 D14.3): HTTP basic authentication against the internal
# user database only (one user per component, full/opensearch/roles.yml); no anonymous access, no demo users.
_meta:
  type: "config"
  config_version: 2
config:
  dynamic:
    http:
      anonymous_auth_enabled: false
      xff:
        enabled: false
    authc:
      basic_internal_auth_domain:
        description: "HTTP Basic against the internal users (generated from Docker secrets)"
        http_enabled: true
        transport_enabled: true
        order: 0
        http_authenticator:
          type: basic
          challenge: false
        authentication_backend:
          type: intern
    authz: {}
