# Full profile (E19-T06): TCP load balancer in front of the clustered data tier. TLS passes through unchanged (every
# node's certificate also names the service alias), so clients verify the node they reach end to end.
#   opensearch:9200  -> opensearch-1..3:9200   (REST over HTTPS)
#   rabbitmq:5671    -> rabbitmq-1..3:5671     (AMQPS)
#   s3:8333          -> every seaweedfs-s3 replica:8333 (S3 over HTTPS)
# Upstreams are re-resolved through Docker's DNS, so scaled or re-created containers are picked up; a node that refuses
# connections is skipped for 10 s (passive health check), which is what keeps work running while one node is down.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format basic '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time "$upstream_addr"';
    access_log /dev/stdout basic;

    proxy_connect_timeout 3s;
    proxy_next_upstream on;
    proxy_next_upstream_tries 3;

    upstream opensearch {
        zone opensearch 64k;
        server opensearch-1:9200 resolve max_fails=1 fail_timeout=10s;
        server opensearch-2:9200 resolve max_fails=1 fail_timeout=10s;
        server opensearch-3:9200 resolve max_fails=1 fail_timeout=10s;
    }

    upstream rabbitmq {
        zone rabbitmq 64k;
        server rabbitmq-1:5671 resolve max_fails=1 fail_timeout=10s;
        server rabbitmq-2:5671 resolve max_fails=1 fail_timeout=10s;
        server rabbitmq-3:5671 resolve max_fails=1 fail_timeout=10s;
    }

    upstream s3 {
        zone s3 64k;
        server seaweedfs-s3:8333 resolve max_fails=1 fail_timeout=10s;
    }

    server {
        listen 9200;
        proxy_pass opensearch;
        proxy_timeout 10m;
    }

    # AMQP connections are long-lived; heartbeats (60 s) keep them inside the timeout.
    server {
        listen 5671;
        proxy_pass rabbitmq;
        proxy_timeout 1h;
    }

    server {
        listen 8333;
        proxy_pass s3;
        proxy_timeout 10m;
    }

    # Liveness for the container healthcheck.
    server {
        listen 127.0.0.1:8099;
        return "ok\n";
    }
}
