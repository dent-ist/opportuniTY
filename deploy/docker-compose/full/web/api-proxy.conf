# Full profile (E19-T06): the web container is the edge. It terminates TLS for browsers (tls.conf, listen 8443, published
# on HTTPS_PORT), serves the SPA, and load-balances /api and /bff over HTTPS across every api replica
# (`--scale api=N` or API_REPLICAS). Docker's DNS returns one address per replica; the resolver re-reads it every 10 s so
# scaling takes effect without restarting web, and a replica that fails is skipped (proxy_next_upstream). The same
# rules as the Lite proxy apply: no compression of /api and /bff (strong ETags), and job events unbuffered.
include /etc/nginx/tls/*.conf;

resolver 127.0.0.11 valid=10s ipv6=off;
# A variable makes nginx resolve at request time and round-robin over every address the name has (one per replica).
set $opportunity_api api:8443;

proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
proxy_ssl_name api;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_next_upstream error timeout http_502 http_503;

location /api/ {
    proxy_pass https://$opportunity_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    client_max_body_size 2g;
    gzip off;
}

location ~ ^/api/v1/workspaces/[^/]+/job-events$ {
    proxy_pass https://$opportunity_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
}

location /bff/ {
    proxy_pass https://$opportunity_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    gzip off;
}
