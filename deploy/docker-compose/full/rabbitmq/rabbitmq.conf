# Full profile RabbitMQ node (E19-T06): a three-node cluster for the quorum queues the migrator declares (one per lane and
# worker type, ADR-010 §7), AMQPS only (ADR-015 D9.5), management and Prometheus listeners on the internal network only.
# Mounted as /etc/rabbitmq/conf.d/90-opportunity.conf; full/rabbitmq/entrypoint.sh copies the certificates first.

# No plain AMQP listener: clients (and the data-lb in front of the nodes) speak AMQPS on 5671.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /var/lib/rabbitmq/tls/ca.crt
ssl_options.certfile = /var/lib/rabbitmq/tls/server.crt
ssl_options.keyfile = /var/lib/rabbitmq/tls/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# Cluster formation: every node knows the other two; quorum queues keep three members, re-added automatically after a
# node is replaced, so losing one node keeps every queue available (2 of 3).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3
cluster_partition_handling = pause_minority
quorum_queue.continuous_membership_reconciliation.enabled = true
quorum_queue.continuous_membership_reconciliation.target_group_size = 3

# The guest user cannot log in from anywhere; the operator's administrator comes from a Docker secret (entrypoint.sh).
loopback_users.guest = true
