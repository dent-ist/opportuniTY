# Developer profile: the SPA (this nginx) forwards the API and the BFF endpoints to the api service, so the browser
# sees one origin (http://localhost:WEB_PORT) for the app, /api and /bff, as the BFF session design requires.
#
# No compression of API or BFF responses: nginx turns a strong ETag ("3") into a weak one (W/"3") when it gzips a
# response, and the API compares If-Match strongly (ADR-019), so a client that sends back the ETag it was given would
# always get 412. Any other proxy in front of the API must likewise leave ETags strong.
location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 2g;
    gzip off;
}

# Job events (E06-T06, Q-35): a long-lived text/event-stream. Stream it unbuffered and keep it open longer than the
# API's 30-minute stream limit; the API sends a heartbeat comment every 15 s and the browser reconnects by itself.
# A regex location, so it wins over the /api/ prefix above. Any other proxy needs the same: no response buffering, no
# compression of text/event-stream and a read timeout above 15 s (the API also sends X-Accel-Buffering: no).
location ~ ^/api/v1/workspaces/[^/]+/job-events$ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
}

location /bff/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip off;
}
