# Developer profile: the SPA (this nginx) forwards the API and the BFF endpoints to the api service, so the browser
# sees one origin (http://localhost:WEB_PORT) for the app, /api and /bff, as the BFF session design requires.
location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 2g;
}

location /bff/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
