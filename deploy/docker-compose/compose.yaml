# opportuniTY developer profile (Lite, E19-T03). EVALUATION AND DEVELOPMENT ONLY: never load real client data (Q-01).
# See README.md. Always run with both env files, versions.env first (image tags and digests), then .env (secrets):
#   docker compose --env-file ../../versions.env --env-file .env up -d --wait
# or use ./opportunity.sh (or make) in this directory, which does exactly that.
#
# Services: postgres, opensearch (1 node), rabbitmq (management UI), keycloak (developer OIDC provider), migrator
# (one-shot), api, worker (combined), web.
# Object store: the filesystem provider on a named volume (ADR-020 rule 1). `--profile s3` adds a single-process
# SeaweedFS for S3 semantics; set OPPORTUNITY_OBJECT_STORAGE=S3 to point api/worker at it.
# `--profile observability` (COMPOSE_PROFILES=observability) adds the OpenTelemetry Collector, Prometheus, Jaeger, Loki
# and Grafana (ADR-017, Q-42); set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 to make api/worker export.
# No Redis/Valkey (architecture baseline §16, §34).

name: ${COMPOSE_PROJECT_NAME:-opportunity-dev}

x-app-hardening: &app-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped

# Placeholders, not secrets: the real values come from .env (generated by `./opportunity.sh init`).
x-app-environment: &app-environment
  DOTNET_ENVIRONMENT: Development
  ASPNETCORE_ENVIRONMENT: Development
  # Runtime login (member of opportunity_app, created by postgres/init). The chiseled images lack libgssapi_krb5.
  ConnectionStrings__App: >-
    Host=postgres;Database=${OPPORTUNITY_DB:-opportunity};Username=${OPPORTUNITY_DB_APP_USER:-opportunity_runtime};Password=${OPPORTUNITY_DB_APP_PASSWORD:?set OPPORTUNITY_DB_APP_PASSWORD in .env (./opportunity.sh init)};GSS Encryption Mode=Disable
  # OpenSearch module (E07, Opportunity.Search); the migrator installs the index templates.
  ConnectionStrings__OpenSearch: http://opensearch:9200
  # RabbitMQ transport (E06-T01, Opportunity.Messaging). Lite uses one broker user for every component; Full uses one
  # user per component with the RabbitMqPermissions patterns (ADR-015 D9.5).
  ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-opportunity}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
  ObjectStorage__Provider: ${OPPORTUNITY_OBJECT_STORAGE:-FileSystem}
  ObjectStorage__FileSystem__RootPath: /var/lib/opportunity/objects
  ObjectStorage__S3__ServiceUrl: http://seaweedfs:8333
  ObjectStorage__S3__Bucket: opportunity
  ObjectStorage__S3__AccessKey: ${S3_ACCESS_KEY:-opportunity}
  ObjectStorage__S3__SecretKey: ${S3_SECRET_KEY:-}
  # OpenTelemetry (ADR-017): off unless an OTLP endpoint is set, e.g. http://otel-collector:4317 with the
  # `observability` profile. Logs are JSON on stdout with trace/span IDs and the correlation scope.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
  Logging__Console__FormatterName: json
  Logging__Console__FormatterOptions__IncludeScopes: "true"

# The chiseled .NET images have no curl/wget; HealthProbe ships in the image. Healthy = /health/ready (dependencies
# and schema version), stricter than the image's own liveness HEALTHCHECK.
x-ready-healthcheck: &ready-healthcheck
  test: ["CMD", "dotnet", "/app/healthprobe/Opportunity.HealthProbe.dll", "http://127.0.0.1:8080/health/ready"]
  interval: 10s
  timeout: 5s
  start_period: 30s
  start_interval: 2s
  retries: 6

x-app-depends-on: &app-depends-on
  migrator:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  opensearch:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  seaweedfs:
    condition: service_healthy
    required: false

services:
  postgres:
    image: postgres:${POSTGRES:?run with --env-file ../../versions.env}@${POSTGRES_DIGEST:?run with --env-file ../../versions.env}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (./opportunity.sh init)}
      POSTGRES_DB: postgres
      # Read by postgres/init/10-opportunity.sh on first start (empty data volume) only.
      OPPORTUNITY_DB: ${OPPORTUNITY_DB:-opportunity}
      OPPORTUNITY_DB_OWNER_USER: ${OPPORTUNITY_DB_OWNER_USER:-opportunity_owner}
      OPPORTUNITY_DB_OWNER_PASSWORD: ${OPPORTUNITY_DB_OWNER_PASSWORD:?set OPPORTUNITY_DB_OWNER_PASSWORD in .env}
      OPPORTUNITY_DB_APP_USER: ${OPPORTUNITY_DB_APP_USER:-opportunity_runtime}
      OPPORTUNITY_DB_APP_PASSWORD: ${OPPORTUNITY_DB_APP_PASSWORD:?set OPPORTUNITY_DB_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    shm_size: 256m
    # TCP, not the socket: the entrypoint's temporary init server listens on the socket only, so this stays
    # unhealthy until roles and the database exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$${OPPORTUNITY_DB}\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 6
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH:?run with --env-file ../../versions.env}@${OPENSEARCH_DIGEST:?run with --env-file ../../versions.env}
    environment:
      discovery.type: single-node
      cluster.name: opportunity-dev
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
      # !!! DEVELOPMENT ONLY !!! The security plugin is OFF: no TLS, no authentication, no authorization on port 9200.
      # Anything that reaches the port can read and delete every index. The port is bound to 127.0.0.1 by default.
      # Full (the only production profile, Q-01) runs with the security plugin on (E19-T06).
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # Ignored while the security plugin is off; required (>= 2.12) as soon as it is enabled.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
      # ADR-008 R7: wildcards inside W/n expand to at most Search:MaxWildcardExpansion terms; beyond it the search fails
      # with WILDCARD_TOO_BROAD instead of being truncated.
      indices.query.bool.max_clause_count: "4096"
    # No memlock/nofile ulimits: rootless Docker and some VMs refuse raising them, and single-node discovery skips
    # the bootstrap checks that need them. Fine for development; Full (E19-T06) sets them.
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 90s
      start_interval: 3s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:${RABBITMQ:?run with --env-file ../../versions.env}@${RABBITMQ_DIGEST:?run with --env-file ../../versions.env}
    # Fixed node name, so the data volume survives container re-creation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-opportunity}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    # The check runs as root with HOME=/var/lib/rabbitmq: before the server has written .erlang.cookie, the CLI would
    # create it root-owned and the server then fails to boot (eacces). Wait for the server's own cookie first.
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      start_interval: 2s
      retries: 6
    restart: unless-stopped

  # Optional S3-compatible store (ADR-020: bundled for Full, optional for Lite): `--profile s3`.
  seaweedfs:
    profiles: [s3]
    image: chrislusf/seaweedfs:${SEAWEEDFS:?run with --env-file ../../versions.env}@${SEAWEEDFS_DIGEST:?run with --env-file ../../versions.env}
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=0", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 6
    restart: unless-stopped

  # One-shot: applies migrations and bootstrap steps, then exits (0 ok, 1 migration failed, 2 configuration error,
  # 3 bootstrap step failed). api and worker start only after it exited 0.
  migrator:
    <<: *app-hardening
    image: ${OPPORTUNITY_IMAGE_PREFIX:-opportunity-local/}opportunity-migrator:${OPPORTUNITY_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      target: migrator
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Migrator: >-
        Host=postgres;Database=${OPPORTUNITY_DB:-opportunity};Username=${OPPORTUNITY_DB_OWNER_USER:-opportunity_owner};Password=${OPPORTUNITY_DB_OWNER_PASSWORD:?set OPPORTUNITY_DB_OWNER_PASSWORD in .env};GSS Encryption Mode=Disable
      # Declares exchanges, quorum queues per lane/worker type, retry tiers, DLX/DLQs and parking queues.
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-opportunity}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      # Installs the versioned projection index templates (E07-T01, ADR-007 R2).
      ConnectionStrings__OpenSearch: http://opensearch:9200
      # Object-storage bootstrap creates the bucket (S3) or container (Azure); FileSystem only prepares the root.
      ObjectStorage__Provider: ${OPPORTUNITY_OBJECT_STORAGE:-FileSystem}
      ObjectStorage__FileSystem__RootPath: /tmp/opportunity-objects
      ObjectStorage__S3__ServiceUrl: http://seaweedfs:8333
      ObjectStorage__S3__Bucket: opportunity
      ObjectStorage__S3__AccessKey: ${S3_ACCESS_KEY:-opportunity}
      ObjectStorage__S3__SecretKey: ${S3_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Bootstrap steps for index templates, exchanges/queues and the bucket (E06/E07/E19) run here, so wait for them too.
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
        required: false

  # Developer OIDC provider (E05-T01, ADR-015 D3): Keycloak (Apache-2.0), realm `opportunity` with demo users and
  # groups imported from keycloak/opportunity-realm.json on every start (no volume: changes made in the admin console
  # are lost on re-create). Full uses the customer's IdP. Browsers and the API must see the same issuer, so the
  # front-end URL is pinned to http://localhost:KEYCLOAK_PORT and the API fetches discovery/JWKS/tokens over the
  # compose network (hostname-backchannel-dynamic).
  keycloak:
    image: keycloak/keycloak:${KEYCLOAK:?run with --env-file ../../versions.env}@${KEYCLOAK_DIGEST:?run with --env-file ../../versions.env}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (./opportunity.sh init)}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Stateless: the realm file is the source of truth and is re-imported on every start.
      KC_DB: dev-mem
    volumes:
      - ./keycloak/opportunity-realm.json:/opt/keycloak/data/import/opportunity-realm.json:ro
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-8180}:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    # No curl in the image: probe the management port's readiness endpoint with bash.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 18
    restart: unless-stopped

  api:
    <<: *app-hardening
    image: ${OPPORTUNITY_IMAGE_PREFIX:-opportunity-local/}opportunity-api:${OPPORTUNITY_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      target: api
    environment:
      <<: *app-environment
      # OIDC with the BFF session (ADR-015 D3/D4). Sign in at http://localhost:API_PORT/bff/login: the session
      # cookie is __Host- prefixed and Secure, which browsers accept over plain HTTP only for localhost.
      Authentication__PublicOrigin: ${OPPORTUNITY_PUBLIC_ORIGIN:-http://localhost:8080}
      Authentication__Oidc__Authority: http://localhost:${KEYCLOAK_PORT:-8180}/realms/opportunity
      Authentication__Oidc__MetadataAddress: http://keycloak:8080/realms/opportunity/.well-known/openid-configuration
      Authentication__Oidc__ClientId: opportunity-web
      # The dev realm's client credential (keycloak/opportunity-realm.json); a real IdP's secret comes from a secret store.
      Authentication__Oidc__ClientSecret: opportunity-dev-client
      Authentication__Oidc__RequireHttpsMetadata: "false"
    volumes:
      - objects:/var/lib/opportunity/objects
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${API_PORT:-8081}:8080"
    healthcheck: *ready-healthcheck
    depends_on: *app-depends-on

  # Combined Lite worker: every worker type in one process (Q-39: 8 GB minimum with the combined worker).
  worker:
    <<: *app-hardening
    image: ${OPPORTUNITY_IMAGE_PREFIX:-opportunity-local/}opportunity-worker:${OPPORTUNITY_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      target: worker
    environment:
      <<: *app-environment
      Workers__Enabled: all
    volumes:
      - objects:/var/lib/opportunity/objects
    healthcheck: *ready-healthcheck
    depends_on: *app-depends-on

  web:
    <<: *app-hardening
    image: ${OPPORTUNITY_IMAGE_PREFIX:-opportunity-local/}opportunity-web:${OPPORTUNITY_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: web
      args:
        APK_UPGRADE: ${WEB_APK_UPGRADE:-1}
    # The SPA forwards /api and /bff to the api service: one origin for the app and its BFF session (ADR-015 D4).
    volumes:
      - ./web/api-proxy.conf:/etc/nginx/api-proxy.d/api-proxy.conf:ro
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # --- Observability profile (ADR-017, Q-42): `--profile observability` ------------------------------------------
  # Optional and for development/evaluation. Licenses: OpenTelemetry Collector, Prometheus, Jaeger and the exporters
  # are Apache-2.0; Grafana and Loki are AGPL-3.0 and are run only as unmodified, optional external services (Q-38).
  # Memory limits keep the whole profile at <= 1.5 GiB. Ports are published on OPPORTUNITY_BIND (127.0.0.1).
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR:?run with --env-file ../../versions.env}@${OTEL_COLLECTOR_DIGEST:?run with --env-file ../../versions.env}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # OTLP for an API or worker run from the IDE on the host: OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
    mem_limit: 256m
    depends_on:
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:${PROMETHEUS:?run with --env-file ../../versions.env}@${PROMETHEUS_DIGEST:?run with --env-file ../../versions.env}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      start_interval: 1s
      retries: 6
    restart: unless-stopped

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:${JAEGER:?run with --env-file ../../versions.env}@${JAEGER_DIGEST:?run with --env-file ../../versions.env}
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      start_interval: 1s
      retries: 6
    restart: unless-stopped

  loki:
    profiles: [observability]
    image: grafana/loki:${LOKI:?run with --env-file ../../versions.env}@${LOKI_DIGEST:?run with --env-file ../../versions.env}
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:${GRAFANA:?run with --env-file ../../versions.env}@${GRAFANA_DIGEST:?run with --env-file ../../versions.env}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (./opportunity.sh init)}
      # Read-only anonymous viewer for local dashboards; editing needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/opportunity-overview.json
      # No phone-home from a self-hosted install.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 6
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped

  # Infrastructure exporters scraped by Prometheus (RabbitMQ exposes its own endpoint via rabbitmq_prometheus).
  postgres-exporter:
    profiles: [observability]
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER:?run with --env-file ../../versions.env}@${POSTGRES_EXPORTER_DIGEST:?run with --env-file ../../versions.env}
    command: ["--no-collector.wal"]
    environment:
      # Development: the DML-only runtime login reads the statistics views. Full uses a dedicated pg_monitor login.
      DATA_SOURCE_URI: postgres:5432/${OPPORTUNITY_DB:-opportunity}?sslmode=disable
      DATA_SOURCE_USER: ${OPPORTUNITY_DB_APP_USER:-opportunity_runtime}
      DATA_SOURCE_PASS: ${OPPORTUNITY_DB_APP_PASSWORD:?set OPPORTUNITY_DB_APP_PASSWORD in .env}
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  opensearch-exporter:
    profiles: [observability]
    image: prometheuscommunity/elasticsearch-exporter:${OPENSEARCH_EXPORTER:?run with --env-file ../../versions.env}@${OPENSEARCH_EXPORTER_DIGEST:?run with --env-file ../../versions.env}
    command: ["--es.uri=http://opensearch:9200", "--es.timeout=10s"]
    mem_limit: 64m
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

configs:
  seaweedfs-s3:
    content: |
      {"identities":[{"name":"opportunity","credentials":[{"accessKey":"${S3_ACCESS_KEY:-opportunity}","secretKey":"${S3_SECRET_KEY:-}"}],
        "actions":["Admin","Read","List","Tagging","Write"]}]}

volumes:
  postgres-data:
  opensearch-data:
  rabbitmq-data:
  seaweedfs-data:
  objects:
  prometheus-data:
  loki-data:
  grafana-data:
