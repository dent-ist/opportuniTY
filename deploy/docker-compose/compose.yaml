# opportuniTY developer profile (Lite, E19-T03). EVALUATION AND DEVELOPMENT ONLY: never load real client data (Q-01).
# See README.md. Always run with both env files, versions.env first (image tags and digests), then .env (secrets):
#   docker compose --env-file ../../versions.env --env-file .env up -d --wait
# or use ./opportunity.sh (or make) in this directory, which does exactly that.
#
# Services: postgres, opensearch (1 node), rabbitmq (management UI), migrator (one-shot), api, worker (combined), web.
# Object store: the filesystem provider on a named volume (ADR-020 rule 1). `--profile s3` adds a single-process
# SeaweedFS for S3 semantics; set OPPORTUNITY_OBJECT_STORAGE=S3 to point api/worker at it.
# No Redis/Valkey (architecture baseline §16, §34).

name: ${COMPOSE_PROJECT_NAME:-opportunity-dev}

x-app-hardening: &app-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped

# Placeholders, not secrets: the real values come from .env (generated by `./opportunity.sh init`).
x-app-environment: &app-environment
  DOTNET_ENVIRONMENT: Development
  ASPNETCORE_ENVIRONMENT: Development
  # Runtime login (member of opportunity_app, created by postgres/init). The chiseled images lack libgssapi_krb5.
  ConnectionStrings__App: >-
    Host=postgres;Database=${OPPORTUNITY_DB:-opportunity};Username=${OPPORTUNITY_DB_APP_USER:-opportunity_runtime};Password=${OPPORTUNITY_DB_APP_PASSWORD:?set OPPORTUNITY_DB_APP_PASSWORD in .env (./opportunity.sh init)};GSS Encryption Mode=Disable
  # Reserved names for the OpenSearch and RabbitMQ modules (E06/E07); nothing reads them yet.
  ConnectionStrings__OpenSearch: http://opensearch:9200
  ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-opportunity}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
  ObjectStorage__Provider: ${OPPORTUNITY_OBJECT_STORAGE:-FileSystem}
  ObjectStorage__FileSystem__RootPath: /var/lib/opportunity/objects
  ObjectStorage__S3__ServiceUrl: http://seaweedfs:8333
  ObjectStorage__S3__Bucket: opportunity
  ObjectStorage__S3__AccessKey: ${S3_ACCESS_KEY:-opportunity}
  ObjectStorage__S3__SecretKey: ${S3_SECRET_KEY:-}

# The chiseled .NET images have no curl/wget; HealthProbe ships in the image. Healthy = /health/ready (dependencies
# and schema version), stricter than the image's own liveness HEALTHCHECK.
x-ready-healthcheck: &ready-healthcheck
  test: ["CMD", "dotnet", "/app/healthprobe/Opportunity.HealthProbe.dll", "http://127.0.0.1:8080/health/ready"]
  interval: 10s
  timeout: 5s
  start_period: 30s
  start_interval: 2s
  retries: 6

x-app-depends-on: &app-depends-on
  migrator:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  opensearch:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  seaweedfs:
    condition: service_healthy
    required: false

services:
  postgres:
    image: postgres:${POSTGRES:?run with --env-file ../../versions.env}@${POSTGRES_DIGEST:?run with --env-file ../../versions.env}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (./opportunity.sh init)}
      POSTGRES_DB: postgres
      # Read by postgres/init/10-opportunity.sh on first start (empty data volume) only.
      OPPORTUNITY_DB: ${OPPORTUNITY_DB:-opportunity}
      OPPORTUNITY_DB_OWNER_USER: ${OPPORTUNITY_DB_OWNER_USER:-opportunity_owner}
      OPPORTUNITY_DB_OWNER_PASSWORD: ${OPPORTUNITY_DB_OWNER_PASSWORD:?set OPPORTUNITY_DB_OWNER_PASSWORD in .env}
      OPPORTUNITY_DB_APP_USER: ${OPPORTUNITY_DB_APP_USER:-opportunity_runtime}
      OPPORTUNITY_DB_APP_PASSWORD: ${OPPORTUNITY_DB_APP_PASSWORD:?set OPPORTUNITY_DB_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    shm_size: 256m
    # TCP, not the socket: the entrypoint's temporary init server listens on the socket only, so this stays
    # unhealthy until roles and the database exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$${OPPORTUNITY_DB}\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 6
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH:?run with --env-file ../../versions.env}@${OPENSEARCH_DIGEST:?run with --env-file ../../versions.env}
    environment:
      discovery.type: single-node
      cluster.name: opportunity-dev
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
      # !!! DEVELOPMENT ONLY !!! The security plugin is OFF: no TLS, no authentication, no authorization on port 9200.
      # Anything that reaches the port can read and delete every index. The port is bound to 127.0.0.1 by default.
      # Full (the only production profile, Q-01) runs with the security plugin on (E19-T06).
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # Ignored while the security plugin is off; required (>= 2.12) as soon as it is enabled.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
    # No memlock/nofile ulimits: rootless Docker and some VMs refuse raising them, and single-node discovery skips
    # the bootstrap checks that need them. Fine for development; Full (E19-T06) sets them.
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 90s
      start_interval: 3s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:${RABBITMQ:?run with --env-file ../../versions.env}@${RABBITMQ_DIGEST:?run with --env-file ../../versions.env}
    # Fixed node name, so the data volume survives container re-creation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-opportunity}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      start_interval: 2s
      retries: 6
    restart: unless-stopped

  # Optional S3-compatible store (ADR-020: bundled for Full, optional for Lite): `--profile s3`.
  seaweedfs:
    profiles: [s3]
    image: chrislusf/seaweedfs:${SEAWEEDFS:?run with --env-file ../../versions.env}@${SEAWEEDFS_DIGEST:?run with --env-file ../../versions.env}
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-volume.max=0", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 6
    restart: unless-stopped

  # One-shot: applies migrations and bootstrap steps, then exits (0 ok, 1 migration failed, 2 configuration error,
  # 3 bootstrap step failed). api and worker start only after it exited 0.
  migrator:
    <<: *app-hardening
    image: ${OPPORTUNITY_IMAGE_PREFIX:-opportunity-local/}opportunity-migrator:${OPPORTUNITY_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      target: migrator
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Migrator: >-
        Host=postgres;Database=${OPPORTUNITY_DB:-opportunity};Username=${OPPORTUNITY_DB_OWNER_USER:-opportunity_owner};Password=${OPPORTUNITY_DB_OWNER_PASSWORD:?set OPPORTUNITY_DB_OWNER_PASSWORD in .env};GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
      # Bootstrap steps for index templates and exchanges/queues (E06/E07) run here, so wait for them too.
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api:
    <<: *app-hardening
    image: ${OPPORTUNITY_IMAGE_PREFIX:-opportunity-local/}opportunity-api:${OPPORTUNITY_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      target: api
    environment:
      <<: *app-environment
    volumes:
      - objects:/var/lib/opportunity/objects
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${API_PORT:-8081}:8080"
    healthcheck: *ready-healthcheck
    depends_on: *app-depends-on

  # Combined Lite worker: every worker type in one process (Q-39: 8 GB minimum with the combined worker).
  worker:
    <<: *app-hardening
    image: ${OPPORTUNITY_IMAGE_PREFIX:-opportunity-local/}opportunity-worker:${OPPORTUNITY_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/dotnet.Dockerfile
      target: worker
    environment:
      <<: *app-environment
      Workers__Enabled: all
    volumes:
      - objects:/var/lib/opportunity/objects
    healthcheck: *ready-healthcheck
    depends_on: *app-depends-on

  web:
    <<: *app-hardening
    image: ${OPPORTUNITY_IMAGE_PREFIX:-opportunity-local/}opportunity-web:${OPPORTUNITY_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: web
      args:
        APK_UPGRADE: ${WEB_APK_UPGRADE:-1}
    ports:
      - "${OPPORTUNITY_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

configs:
  seaweedfs-s3:
    content: |
      {"identities":[{"name":"opportunity","credentials":[{"accessKey":"${S3_ACCESS_KEY:-opportunity}","secretKey":"${S3_SECRET_KEY:-}"}],
        "actions":["Admin","Read","List","Tagging","Write"]}]}

volumes:
  postgres-data:
  opensearch-data:
  rabbitmq-data:
  seaweedfs-data:
  objects:
