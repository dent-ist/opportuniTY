# nginx for the opportunity-web image: serves the Angular build only. TLS termination and /api routing belong to
# the edge proxy in front of it (ADR-015 D15). Runs as the unprivileged nginx user (UID 101) on port 8080; every
# writable path is under /tmp, so the container runs with a read-only root filesystem plus a tmpfs at /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1k;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # Same-origin API (ADR-015 D4: the BFF session cookie and the Origin check need the SPA and /api, /bff on one
        # origin). The image ships no upstream; a deployment mounts its proxy locations here (compose: web/api-proxy.conf).
        include /etc/nginx/api-proxy.d/*.conf;

        # Container HEALTHCHECK and orchestrator probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Content-hashed bundles (outputHashing: all, e.g. main-7Q5XNQ5S.js) never change under the same name.
        location ~* "-[a-z0-9]{8}\.(?:js|mjs|css|woff2?|ttf)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        # add_header in a location replaces the server-level headers, hence the include in each location.
        # SPA fallback: client-side routes resolve to index.html, which must always be revalidated.
        location / {
            try_files $uri $uri/ /index.html;
            # Angular ngCspNonce: same value as the style-src nonce in security-headers.conf.
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter "__CSP_NONCE__" $request_id;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
